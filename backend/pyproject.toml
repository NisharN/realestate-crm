[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S105", "S106", "B008", "S104", "E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]
"app/seed.py" = ["S311"]
"alembic/env.py" = ["E402"]
